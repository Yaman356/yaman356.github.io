# Tezgâh: her değişiklikte web, Android ve iOS derlemesi.
# Android: hata ayıklama APK'sı (telefona kurulabilir) eser olarak yüklenir.
# iOS: imzasız simülatör derlemesi; kodun Xcode'da derlendiğini doğrular. Mağaza derlemesi için imza gerekir (app/README.md).
name: Mobil derleme

on:
  push:
    paths: ['app/**', 'demo/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: tezgah-android-debug
          path: app/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - run: xcodebuild -version
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tezgah-web
          path: app/www
